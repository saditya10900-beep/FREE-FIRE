
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aditya Battle Arena</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101820;color:white;
 font-family:Arial;text-align:center
}
h1{color:#ffb000;text-shadow:0 0 12px orange}
#game{
 position:relative;width:95%;max-width:850px;
 height:480px;margin:15px auto;
 overflow:hidden;border:3px solid #ffb000;
 background:linear-gradient(#5bb5c9 0 38%,#638e3d 38% 100%);
}
#ground{
 position:absolute;bottom:0;width:100%;height:45%;
 background:repeating-linear-gradient(25deg,#537e31 0 30px,#628b3c 30px 60px);
}
#player,#enemy{
 position:absolute;font-size:43px;z-index:2;
 transform:translate(-50%,-50%);
}
#player{left:50%;top:70%}
.enemy{position:absolute;font-size:35px;z-index:2}
.bullet{
 position:absolute;width:12px;height:5px;
 background:#ffe600;border-radius:5px;z-index:3
}
#hud{
 display:flex;justify-content:space-around;flex-wrap:wrap;
 gap:10px;padding:10px;font-weight:bold
}
button{
 background:#ff9d00;color:#171717;border:0;
 padding:12px 18px;margin:5px;border-radius:8px;
 font-weight:bold;font-size:16px;cursor:pointer
}
#controls{max-width:450px;margin:auto}
</style>
</head>
<body>
<h1>🔥 ADITYA BATTLE ARENA 🔥</h1>
<div id="hud">
 <span>❤️ HP: <b id="hp">100</b></span>
 <span>🎯 Kills: <b id="kills">0</b></span>
 <span>🔫 Ammo: <b id="ammo">30</b></span>
</div>

<div id="game">
 <div id="ground"></div>
 <div id="player">🧑🏻‍🚀</div>
</div>

<button onclick="startGame()">▶ START GAME</button>
<button onclick="shoot()">🔫 FIRE</button>
<div id="controls">
 <button onclick="move(0,-20)">⬆️</button><br>
 <button onclick="move(-20,0)">⬅️</button>
 <button onclick="move(20,0)">➡️</button>
 <button onclick="move(0,20)">⬇️</button>
</div>
<p id="msg">START GAME दबाकर खेल शुरू करो!</p>
<p>PC: Arrow Keys से चलो, Space से गोली चलाओ।</p>

<script>
const game=document.getElementById('game');
const player=document.getElementById('player');
let x=game.clientWidth/2,y=game.clientHeight*.7;
let hp=100,kills=0,ammo=30,running=false;
let enemies=[],timer;

function update(){
 player.style.left=x+'px';
 player.style.top=y+'px';
 document.getElementById('hp').textContent=hp;
 document.getElementById('kills').textContent=kills;
 document.getElementById('ammo').textContent=ammo;
}
function move(dx,dy){
 if(!running)return;
 x=Math.max(22,Math.min(game.clientWidth-22,x+dx));
 y=Math.max(55,Math.min(game.clientHeight-25,y+dy));
 update();
}
function spawnEnemy(){
 if(!running||enemies.length>=7)return;
 const e=document.createElement('div');
 e.className='enemy';e.textContent='🪖';
 e.style.left=Math.random()*(game.clientWidth-60)+30+'px';
 e.style.top=(70+Math.random()*(game.clientHeight-130))+'px';
 game.appendChild(e);
 enemies.push({el:e,hp:1});
}
function shoot(){
 if(!running)return;
 if(ammo<=0){document.getElementById('msg').textContent='Ammo खत्म!';return}
 ammo--;update();
 let target=null,dist=Infinity;
 enemies.forEach(e=>{
  const ex=parseFloat(e.el.style.left);
  const ey=parseFloat(e.el.style.top);
  const d=Math.hypot(ex-x,ey-y);
  if(d<dist){dist=d;target=e}
 });
 const b=document.createElement('div');
 b.className='bullet';
 b.style.left=x+'px';b.style.top=y+'px';
 game.appendChild(b);
 setTimeout(()=>b.remove(),250);
 if(target&&dist<260){
  target.el.remove();
  enemies=enemies.filter(e=>e!==target);
  kills++;update();
  document.getElementById('msg').textContent='🎯 Enemy Down!';
 }
}
function startGame(){
 clearInterval(timer);
 enemies.forEach(e=>e.el.remove());
 enemies=[];hp=100;kills=0;ammo=30;
 x=game.clientWidth/2;y=game.clientHeight*.7;
 running=true;update();
 document.getElementById('msg').textContent='दुश्मनों को हराओ!';
 timer=setInterval(()=>{
  if(!running)return;
  spawnEnemy();
  if(enemies.length){
   hp=Math.max(0,hp-2);
   update();
   if(hp===0){
    running=false;clearInterval(timer);
    document.getElementById('msg').textContent=
      'GAME OVER! Kills: '+kills+' — फिर से खेलो!';
   }
  }
 },1800);
}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp')move(0,-20);
 if(e.key==='ArrowDown')move(0,20);
 if(e.key==='ArrowLeft')move(-20,0);
 if(e.key==='ArrowRight')move(20,0);
 if(e.code==='Space'){e.preventDefault();shoot()}
});
window.addEventListener('resize',()=>{
 x=Math.min(x,game.clientWidth-22);update();
});
update();
</script>
</body>
</html>
